name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install shells used by the helper syntax checks
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y zsh fish
          else
            # macOS runners already ship zsh.
            brew install fish
          fi
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Smoke check entry points
        run: |
          gwork --help
          git-gwork --help
      - name: Shell helper syntax
        run: |
          bash -n contrib/gwork.bash
          zsh -n contrib/gwork.zsh
          fish -n contrib/gwork.fish
      - name: Checked-in contrib helpers match generated output
        run: |
          gwork --print-shell-integration bash | diff -u contrib/gwork.bash -
          gwork --print-shell-integration zsh | diff -u contrib/gwork.zsh -
          gwork --print-shell-integration fish | diff -u contrib/gwork.fish -
