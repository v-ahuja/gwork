name: prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New PEP 440 version (for example, 0.1.3)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: release/v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main with tags
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build packaging twine
          sudo apt-get update
          sudo apt-get install --yes fish zsh

      - name: Validate and update version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import urllib.error
          import urllib.request

          from packaging.version import InvalidVersion, Version

          requested_text = os.environ["RELEASE_VERSION"]
          try:
              requested = Version(requested_text)
          except InvalidVersion as error:
              raise SystemExit(f"Invalid PEP 440 version: {requested_text!r}") from error

          if str(requested) != requested_text:
              raise SystemExit(
                  f"Version must use its canonical PEP 440 form: {requested_text!r} -> {requested}"
              )

          pyproject_path = pathlib.Path("pyproject.toml")
          package_path = pathlib.Path("src/gw/__init__.py")
          pyproject = pyproject_path.read_text()
          package = package_path.read_text()

          project_match = re.search(r'(?m)^version = "([^"]+)"$', pyproject)
          package_match = re.search(r'(?m)^__version__ = "([^"]+)"$', package)
          if not project_match or not package_match:
              raise SystemExit("Could not find both version declarations")

          current = Version(project_match.group(1))
          if requested <= current:
              raise SystemExit(f"New version {requested} must be greater than {current}")

          tag = f"v{requested}"
          tags = subprocess.check_output(["git", "tag", "--list", tag], text=True).strip()
          if tags:
              raise SystemExit(f"Git tag {tag} already exists")

          url = f"https://pypi.org/pypi/gwork/{requested}/json"
          try:
              with urllib.request.urlopen(url):
                  pass
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit(f"gwork {requested} is already published on PyPI")

          pyproject = pyproject[: project_match.start(1)] + str(requested) + pyproject[project_match.end(1) :]
          package = package[: package_match.start(1)] + str(requested) + package[package_match.end(1) :]
          pyproject_path.write_text(pyproject)
          package_path.write_text(package)
          PY

          git diff --check
          if git diff --exit-code --quiet; then
            echo "The requested version produced no changes." >&2
            exit 1
          fi

      - name: Install package and run tests
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests

      - name: Check entry points and shell integrations
        run: |
          gwork --help
          git-gwork --help
          bash -n contrib/gwork.bash
          zsh -n contrib/gwork.zsh
          fish -n contrib/gwork.fish
          gwork --print-shell-integration bash | diff -u contrib/gwork.bash -
          gwork --print-shell-integration zsh | diff -u contrib/gwork.zsh -
          gwork --print-shell-integration fish | diff -u contrib/gwork.fish -

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python -m venv /tmp/gwork-release-check
          /tmp/gwork-release-check/bin/python -m pip install dist/*.whl
          /tmp/gwork-release-check/bin/python - <<'PY'
          import os
          from importlib.metadata import version

          import gw

          expected = os.environ["RELEASE_VERSION"]
          assert version("gwork") == expected
          assert gw.__version__ == expected
          PY
          /tmp/gwork-release-check/bin/gwork --help
          /tmp/gwork-release-check/bin/git-gwork --help

      - name: Commit changes and open pull request
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "Remote branch $RELEASE_BRANCH already exists." >&2
            echo "Close or merge its release PR, then delete the branch before retrying." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$RELEASE_BRANCH"
          git add pyproject.toml src/gw/__init__.py
          git commit -m "Prepare release $RELEASE_VERSION"
          git push --set-upstream origin "$RELEASE_BRANCH"
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Prepare release $RELEASE_VERSION" \
            --body "Updates the package version to \`$RELEASE_VERSION\`. The release-preparation workflow validated the version, ran the test suite and shell integration checks, and built and checked both distributions."
